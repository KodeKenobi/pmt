appId: com.enable.pmt
productName: Enable PMT
copyright: Copyright © 2025 Enable
buildVersion: "1"

# Source / output
directories:
  output: release
  buildResources: public/brand

# Assets to bundle into the app
files:
  - "electron/**/*"
  - "public/**/*"
  # Next.js standalone output (used in production builds)
  - ".next/standalone/**/*"
  - ".next/static/**/*"
  - "next.config.ts"
  - "package.json"

# ─── Windows ──────────────────────────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  verifyUpdateCodeSignature: false # allow self-signed dev cert

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Enable PMT
  perMachine: false

# ─── macOS ────────────────────────────────────────────────────────────────────
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: public/brand/icon-512.svg
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: null
  entitlementsInherit: null

dmg:
  contents:
    - x: 410
      y: 150
      type: link
      path: /Applications
    - x: 130
      y: 150
      type: file

# ─── Linux ────────────────────────────────────────────────────────────────────
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: public/brand/icon-512.svg
  category: Office

# ─── Auto-updater (electron-updater) ─────────────────────────────────────────
# Points at GitHub Releases on the main repo. Set GH_TOKEN in CI for publishing.
publish:
  - provider: github
    owner: enable
    repo: project-management-tool
    releaseType: release

# ─── Build-time options ───────────────────────────────────────────────────────
compression: normal # fast builds in dev; use "maximum" for production releases
removePackageScripts: true
