<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Enable — Reset Password</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f7fafc;
            color: #0f172a;
        }

        .wrapper {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            padding: 32px;
        }

        .card {
            background: #0b1220;
            color: #fff;
            border-radius: 12px;
            overflow: hidden;
        }

        .header {
            padding: 28px;
            background: linear-gradient(90deg, #0ea5e9 0%, #7c3aed 100%);
        }

        .header h1 {
            margin: 0;
            font-weight: 300;
            font-size: 28px;
        }

        .body {
            padding: 28px;
            background: #071026;
        }

        .body p {
            margin: 0 0 16px 0;
            color: #cbd5e1;
            font-size: 15px;
        }

        .cta {
            display: inline-block;
            padding: 12px 22px;
            background: #3b82f6;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }

        .muted {
            color: #94a3b8;
            font-size: 13px;
        }

        .footer {
            padding: 18px 28px;
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand .logo {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: linear-gradient(90deg, #0ea5e9, #7c3aed);
        }

        .brand .name {
            font-size: 18px;
            font-weight: 300;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="card">
            <div class="header">
                <div class="brand">
                    <div class="logo" aria-hidden="true"></div>
                    <div class="name">Enable</div>
                </div>
            </div>
            <div class="body">
                <p>Hello <strong><!-- RECIPIENT_NAME --></strong>,</p>
                <p>We received a request to reset your Enable account password.</p>
                <p>Click the button below to choose a new password and regain access.</p>
                <p style="margin-top:18px">
                    <a class="cta" href="<!-- RESET_LINK -->">Reset password</a>
                </p>
                <p class="muted" style="margin-top:18px">This link expires in 1 hour. If you didn't request this, please
                    ignore this message.</p>
            </div>
            <div class="footer">
                Lighthouse Project Management — Internal use only
            </div>
        </div>
    </div>
</body>

</html>
